name: Nodejs CI for Backend Service

env:
  AZURE_WEBAPP_NAME: reachapacservice

on:
    push:
        branches:
            - 'main'
        paths:
            - 'backend/**'
    workflow_dispatch:
      
permissions:
    contents: 'read'
    packages: 'write'

jobs:
    build:
        runs-on: ubuntu-latest
        
        steps:
            - uses: actions/checkout@v4

            - name: Set up Azure CLI
              uses: azure/setup-azure-cli@v1

            - name: Log in to Azure using Storage Account Key
              run: |
                az storage blob download \
                  --account-name reachapac \
                  --container-name reachapackeys \
                  --name serviceAccountKey.json \
                  --file ./backend/serviceAccountKey.json \
                  --account-key ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
        
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2
        
            - name: Log in to GitHub container registry
              uses: docker/login-action@v2
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        
            - name: Lowercase the repo name
              run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
            
            - name: Verify the Firebase service account JSON content
              run: cat ./backend/serviceAccountKey.json
        
            - name: Build and push container image to registry
              uses: docker/build-push-action@v4
              with:
                context: ./backend
                push: true
                tags: ghcr.io/${{ env.REPO }}:${{ github.sha }}
                file: ./backend/Dockerfile
                no-cache: true
        
    deploy:
        runs-on: ubuntu-latest
        
        needs: build
        
        steps:
            - name: Lowercase the repo name
              run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
        
            - name: Deploy to Azure Web App
              id: deploy-to-webapp
              uses: azure/webapps-deploy@85270a1854658d167ab239bce43949edb336fa7c
              with:
                  app-name: ${{ env.AZURE_WEBAPP_NAME }}
                  publish-profile: ${{ secrets.AZURE_REACHAPACSERVICE_WEBAPP_PUBLISH_PROFILE }}
                  images: 'ghcr.io/${{ env.REPO }}:${{ github.sha }}'